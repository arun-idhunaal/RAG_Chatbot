# Daily freshness — 10:00 AM IST = 04:30 UTC (Architecture §12 / PRD §1)
name: Daily ingest refresh

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          playwright install --with-deps chromium

      - name: Cache HuggingFace / torch models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-bge-m3-${{ hashFiles('requirements.txt') }}

      - name: Daily refresh (ingest + health)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHROMA_PERSIST_DIR: data/chroma
          RAW_HTML_DIR: data/raw
          AUDIT_LOG_DIR: data/audit
          METRICS_LOG_DIR: data/metrics
        run: python -m scripts.daily_refresh

      - name: Upload audit + metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-artifacts-${{ github.run_id }}
          path: |
            data/audit/
            data/metrics/
            data/chroma/
          retention-days: 7
