# Daily freshness — 10:00 AM IST = 04:30 UTC
# Hits the live Render API so Chroma on the persistent disk is updated.
name: Daily ingest refresh

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  refresh-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Render ingest
        env:
          RENDER_INGEST_URL: ${{ secrets.RENDER_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -z "$RENDER_INGEST_URL" ] || [ -z "$INGEST_TOKEN" ]; then
            echo "Skipping: set GitHub secrets RENDER_INGEST_URL and INGEST_TOKEN"
            echo "Example: https://YOUR-SERVICE.onrender.com/v1/admin/ingest"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_INGEST_URL" \
            -H "Authorization: Bearer $INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 60
          echo
