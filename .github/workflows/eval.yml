# Phase 6 eval gate — EDGECASES.md §12 (S0 blocks release, S1 blocks acceptance)
name: Eval suite

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Phase 6 eval harness
        env:
          USE_LLM_CLASSIFIER: "false"
          GROQ_API_KEY: ""
        run: python -m scripts.run_eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: data/eval/
          retention-days: 14
