[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indmoney-mf-faq-chatbot"
version = "0.1.0"
description = "INDmoney MF FAQ Chatbot (RAG) — ICICI Prudential, 5 schemes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "torch>=2.0",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "tiktoken>=0.7",
  "tzdata>=2024.1",
  "rapidfuzz>=3.0",
  "groq>=0.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
playwright = [
  "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
